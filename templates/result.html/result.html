<!DOCTYPE html>
<html>
<head>
    <title>Interview Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Interview Result</h2>

    <p class="score">Total Score: {{ total_score }}</p>

    <hr>

    {% for item in details %}
        <p><b>Question:</b> {{ item.question }}</p>
        <p><b>Score:</b> {{ item.score }}</p>
        <p><b>Feedback:</b> {{ item.feedback }}</p>
        <hr>
    {% endfor %}

    <a href="/download">
        <button>Download Interview Report (PDF)</button>
    </a>

    <div class="footer-note">
        Generated by AI Interview Preparation System
    </div>
</div>

</body>
</html>
